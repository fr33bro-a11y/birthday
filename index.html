<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srećan Rođendan!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffeef0;
            color: #d63384;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background: #ff85a2;
            padding: 50px 20px;
            color: white;
            animation: fadeIn 2s;
        }
        .container {
            padding: 20px;
        }
        .photo-frame {
            border: 10px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            max-width: 80%;
            margin: 20px auto;
        }
        h1 { font-size: 3em; margin: 0; }
        p { font-size: 1.2em; line-height: 1.6; }
        .heart {
            color: #e31b23;
            font-size: 50px;
            animation: beat 1s infinite;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .btn-surprise {
            background-color: #d63384;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Srećan rođendan, ljubavi! ❤️</h1>
        <p>Danas je tvoj poseban dan, a ovo je mali delić naše magije.</p>
    </header>

    <div class="container">
        <div class="heart">❤️</div>
